name: 시험

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-rules:
    name: DB 규칙 66건
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: psql 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 규칙 시험
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432
        run: ./db/run_tests.sh

  pipeline:
    name: 쇼츠 합성기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg·한글 글꼴 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: 권리 미확인 자산이면 합성 거부 (exit 2)
        run: |
          python - <<'PY'
          import json; j = json.load(open("pipeline/samples/job_TRP-00001.json"))
          j["rights"][1]["rights_status"] = "unverified"
          json.dump(j, open("pipeline/samples/_blocked.json", "w"), ensure_ascii=False)
          PY
          set +e; python pipeline/render_short.py pipeline/samples/_blocked.json --out /tmp/r --tts none; code=$?; set -e
          test "$code" -eq 2
      - name: 승인 자산으로 시험 합성 + 품질검사
        run: python pipeline/render_short.py pipeline/samples/job_TRP-00001.json --out /tmp/renders --tts none

  hub:
    name: 웹허브 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: 빌드 시점에 DB 가 없어도 빌드되는지 (Coolify 는 환경변수를 빌드에도 넘김)
        run: npm run build
        env:
          SUPABASE_URL: http://supabase-kong-unreachable:8000
          SUPABASE_ANON_KEY: x
          SUPABASE_SERVICE_ROLE_KEY: x
          DATABASE_URL: postgresql://u:p@unreachable:5432/postgres

  image:
    name: 배포 이미지 (빌드 → 시작 시 마이그레이션 → 상태 확인)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t twj-hub .
      - name: 컨테이너 시작 (서비스 DB 네트워크에 연결)
        run: |
          NET=$(docker network ls --format '{{.Name}}' | grep github_network | head -1)
          PG=$(docker ps --format '{{.Names}}' | grep postgres | head -1)
          docker run -d --name hub --network "$NET" -p 3000:3000 \
            -e DATABASE_URL="postgresql://postgres:postgres@$PG:5432/postgres" \
            -e CONSOLE_STAFF="11111111-2222-3333-4444-555555555555|CI|product" \
            -e CONSOLE_USERS="ci:ci-pass:11111111-2222-3333-4444-555555555555" \
            twj-hub
      - name: 상태 확인 · 콘솔 로그인
        run: |
          for i in $(seq 1 40); do curl -sf localhost:3000/api/health && break; sleep 3; done
          docker logs hub | tee /tmp/hub.log
          grep -q "새로 적용 $(ls db/migrations/*.sql | wc -l)개" /tmp/hub.log
          grep -q "운영자 확인: CI" /tmp/hub.log
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/console)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-pass localhost:3000/console)" = 200
      - name: 재시작해도 마이그레이션 중복 없음
        run: |
          docker restart hub
          for i in $(seq 1 40); do curl -sf localhost:3000/api/health && break; sleep 3; done
          docker logs hub 2>&1 | grep -q "새로 적용 0개"
